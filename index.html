<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAI - 맞춤형 AI 오답노트 & 학습 플래너</title>
    
    <!-- TailWind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind CDN 로딩 직후 설정 적용
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            animation: scan 2s infinite ease-in-out;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">

    <!-- 상단 네비게이션 바 -->
    <nav class="bg-indigo-600 dark:bg-indigo-950 text-white shadow-lg sticky top-0 z-50 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-brain text-2xl text-yellow-300"></i>
                <span class="font-bold text-xl tracking-tight">EduAI <span class="text-xs font-normal bg-indigo-500 px-2 py-1 rounded-full">v2.5</span></span>
            </div>
            
            <!-- 상단 제어 버튼 모음 -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- 1. 다크/라이트 모드 토글 버튼 -->
                <button type="button" onclick="toggleDarkMode()" class="bg-indigo-500 hover:bg-indigo-400 dark:bg-slate-800 dark:hover:bg-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 shadow-sm">
                    <i id="themeIcon" class="fa-solid fa-moon text-yellow-300"></i>
                    <span id="themeText">다크모드</span>
                </button>

                <!-- 2. 앱 사용방법 버튼 -->
                <button type="button" onclick="openModal('howToUseModal')" class="bg-yellow-400 hover:bg-yellow-300 text-indigo-900 font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-book-open"></i> 사용방법
                </button>

                <!-- 3. 수행평가 정보 버튼 -->
                <button type="button" onclick="openModal('evaluationModal')" class="bg-indigo-500 hover:bg-indigo-400 dark:bg-indigo-800 dark:hover:bg-indigo-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-award"></i> 수행평가 정보
                </button>
            </div>
        </div>
    </nav>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- 메인 비주얼 배너 -->
        <section class="bg-gradient-to-r from-indigo-600 to-indigo-500 dark:from-indigo-900 dark:to-slate-800 rounded-2xl p-6 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-2">
                <span class="bg-indigo-400/40 text-yellow-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">AI STUDY ASSISTANT</span>
                <h1 class="text-2xl md:text-3xl font-extrabold">나만의 AI 맞춤형 오답노트 & 플래너</h1>
                <p class="text-indigo-100 dark:text
