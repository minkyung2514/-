<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiNote & Planner - AI 맞춤형 오답노트 & 학습 플래너</title>
    
    <!-- TailWind CSS & Chart.js & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            animation: scan 2s infinite ease-in-out;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100">

    <!-- 상단 네비게이션 바 -->
    <nav class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 text-white sticky top-0 z-50 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight block leading-none">AiNote & Planner</span>
                    <span class="text-[10px] text-slate-400 font-normal">초·중·고 맞춤형 인공지능 학습 솔루션</span>
                </div>
            </div>
            
            <!-- 상단 제어 버튼 및 학년 선택 -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- 학년급 선택 탭 -->
                <div class="bg-slate-900/80 p-1 rounded-xl border border-slate-700/60 flex text-xs">
                    <button type="button" onclick="setSchoolLevel('elementary')" id="btn-elementary" class="px-3 py-1.5 rounded-lg font-semibold transition">초등</button>
                    <button type="button" onclick="setSchoolLevel('middle')" id="btn-middle" class="px-3 py-1.5 rounded-lg font-semibold transition">중등</button>
                    <button type="button" onclick="setSchoolLevel('high')" id="btn-high" class="px-3 py-1.5 rounded-lg font-semibold transition bg-blue-600 text-white shadow">고등</button>
                </div>

                <!-- 다크/라이트 모드 토글 -->
                <button type="button" onclick="toggleDarkMode()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5
