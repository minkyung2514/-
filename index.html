        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #2563eb, transparent);
            animation: scan 2s infinite ease-in-out;

            50% { top: 100%; }
            100% { top: 0%; }
        }
