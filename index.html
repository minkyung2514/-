<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전학년 AI 맞춤형 오답노트 & 학습 플래너 | GitHub Project</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0edff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Inter & Noto Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* 다크모드/라이트모드 대응 Glass Panel */
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.1);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkbg dark:text-slate-100 min-h-screen flex flex-col custom-scrollbar">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div id="app-logo-icon" class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30 transition-all">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none tracking-tight flex items-center gap-2 text-slate-900 dark:text-white">
                        AiNote & Planner
                        <span id="school-level-badge" class="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-600 dark:text-blue-400 border border-blue-500/30">고등학생</span>
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">초·중·고 맞춤형 인공지능 학습 솔루션</p>
                </div>
            </div>

            <!-- School Level Selector & Controls -->
            <div class="flex items-center space-x-3 text-sm">
                <!-- Level Dropdown Selector -->
                <div class="flex items-center bg-slate-200 dark:bg-slate-800 rounded-xl p-1 border border-slate-300 dark:border-slate-700">
                    <button type="button" onclick="setSchoolLevel('elem')" id="btn-elem" class="px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i class="fa-solid fa-child text-amber-500 dark:text-amber-400 mr-1"></i>초등
                    </button>
                    <button type="button" onclick="setSchoolLevel('mid')" id="btn-mid" class="px-3 py-1 rounded-lg text-xs font-semibold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i class="fa-solid fa-user-graduate text-emerald-500 dark:text-emerald-400 mr-1"></i>중등
                    </button>
                    <button type="button" onclick="setSchoolLevel('high')" id="btn-high" class="px-3 py-1 rounded-lg text-xs font-semibold transition bg-blue-600 text-white shadow">
                        <i class="fa-solid fa-graduation-cap text-blue-200 mr-1"></i>고등
                    </button>
                </div>

                <!-- 다크모드 / 라이트모드 토글 버튼 -->
                <button type="button" onclick="toggleTheme()" class="px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition text-xs font-semibold flex items-center gap-1.5 border border-slate-300 dark:border-slate-700">
                    <i id="theme-icon" class="fa-solid fa-sun text-amber-400"></i>
                    <span id="theme-text">라이트모드</span>
                </button>

                <!-- 사용방법 버튼 -->
                <button type="button" onclick="openManual()" class="px-3.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition text-xs font-bold shadow-md flex items-center gap-1.5 border border-blue-400/30">
                    <i class="fa-solid fa-book-open"></i> 사용방법
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Top Overview Banner -->
        <div id="main-banner" class="rounded-2xl bg-gradient-to-r from-blue-900/80 via-indigo-900/70 to-purple-900/80 dark:from-blue-900/40 dark:via-indigo-900/30 dark:to-purple-900/40 border border-blue-500/30 dark:border-blue-500/20 p-6 shadow-xl relative overflow-hidden transition-all duration-300">
            <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <span id="banner-tag" class="text-xs font-semibold uppercase tracking-wider text-blue-300 dark:text-blue-400 bg-blue-500/20 dark:bg-blue-500/10 px-2.5 py-1 rounded-full border border-blue-400/30 dark:border-blue-500/20">고등 수능/내신 대비 정밀 AI 시스템</span>
                    <h2 id="banner-title" class="text-2xl sm:text-3xl font-extrabold text-white mt-2">AI 맞춤형 오답노트 & 학습 플래너</h2>
                    <p id="banner-desc" class="text-slate-200 dark:text-slate-300 text-sm mt-1 max-w-2xl leading-relaxed">
                        OCR 문제 스캔으로 시간 절감 · ML 분류 모델을 통한 취약 단원 정밀 분석 · 시험 D-Day 기준 일일 자동 스케줄링
                    </p>
                </div>
                <div class="flex flex-wrap sm:flex-nowrap gap-3">
                    <button type="button" onclick="scrollToSection('scan-section')" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition shadow-lg shadow-blue-600/30 flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> 문제 스캔하기
                    </button>
                    <button type="button" onclick="scrollToSection('dashboard-section')" class="px-4 py-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-100 font-medium text-sm transition border border-slate-600 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie"></i> 취약점 리포트
                    </button>
                </div>
            </div>
        </div>

        <!-- Section Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEFT COLUMN: Input & Upload (OCR Simulation) -->
            <section id="scan-section" class="lg:col-span-5 space-y-6">
                <div class="glass-panel p-6 rounded-2xl shadow-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up text-blue-500 dark:text-blue-400"></i>
                            1. 오답 문제 등록 & OCR 스캔
                        </h3>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-semibold">Step 1 / 3</span>
                    </div>

                    <!-- Dropzone / Image Uploader -->
                    <div id="drop-zone" class="border-2 border-dashed border-slate-300 dark:border-slate-
