<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiNote & Planner - AI 맞춤형 오답노트 & 학습 플래너</title>
    
    <!-- Tailwind CSS & Chart.js & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; transition: background-color 0.2s, color 0.2s; }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #2563eb, transparent);
            animation: scan 2s infinite ease-in-out;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* ===== 라이트모드 전용 강제 커스텀 스타일 (파란색 & 흰색 조합) ===== */
        body.light-mode {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        body.light-mode nav {
            background-color: #ffffff !important;
            border-color: #e2e8f0 !important;
            color: #0f172a !important;
        }
        body.light-mode .card-box {
            background-color: #ffffff !important;
            border-color: #dbeafe !important;
            color: #0f172a !important;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.05) !important;
        }
        body.light-mode .upload-zone {
            background-color: #eff6ff !important;
            border-color: #93c5fd !important;
            color: #1e3a8a !important;
        }
        body.light-mode .input-box {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode .planner-item {
            background-color: #f1f5f9 !important;
            border-color: #e2e8f0 !important;
        }
        body.light-mode .feedback-box {
            background-color: #eff6ff !important;
            border-color: #bfdbfe !important;
            color: #1e40af !important;
        }
        body.light-mode .sub-text {
            color: #475569 !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-200">

    <!-- 상단 네비게이션 바 -->
    <nav class="bg-slate-800/90 border-b border-slate-700/60 text-white sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-lg text-white shadow-lg">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight block leading-none">AiNote & Planner</span>
                    <span class="text-[10px] sub-text text-slate-400">초·중·고 맞춤형 인공지능 학습 솔루션</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="bg-slate-900/80 p-1 rounded-xl border border-slate-700/60 flex text-xs">
                    <button type="button" onclick="setSchoolLevel('elementary')" id="btn-elementary" class="px-3 py-1.5 rounded-lg font-semibold transition text-slate-400 hover:text-white">초등</button>
                    <button type="button" onclick="setSchoolLevel('middle')" id="btn-middle" class="px-3 py-1.5 rounded-lg font-semibold transition text-slate-400 hover:text-white">중등</button>
                    <button type="button" onclick="setSchoolLevel('high')" id="btn-high" class="px-3 py-1.5 rounded-lg font-semibold transition bg-blue-600 text-white shadow">고등</button>
                </div>

                <button type="button" onclick="toggleTheme()" id="themeBtn" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border border-slate-600">
                    <i id="themeIcon" class="fa-solid fa-sun text-amber-400"></i>
                    <span id="themeText">라이트모드</span>
                </button>

                <button type="button" onclick="openModal('howToUseModal')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-book-open"></i> 사용방법
                </button>

                <button type="button" onclick="openModal('evaluationModal')" class="bg-slate-700 hover:bg-slate-600 text-white border border-slate-600 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-award text-yellow-400"></i> 수행평가 가이드
                </button>
            </div>
        </div>
    </nav>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- 히어로 배너 -->
        <section class="bg-gradient-to-r from-blue-900 via-indigo-950 to-slate-900 border border-slate-700/60 rounded-2xl p-6 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-2">
                <span class="bg-blue-500/20 border border-blue-400/30 text-blue-300 text-[11px] font-bold px-3 py-1 rounded-full uppercase" id="levelTag">고등 수능/내신 대비 정밀 AI 시스템</span>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">AI 맞춤형 오답노트 & 학습 플래너</h1>
                <p class="text-slate-300 text-xs md:text-sm max-w-2xl leading-relaxed">OCR 문제 스캔으로 시간 절감 · ML 분류 모델을 통한 취약 단원 정밀 분석 · 일일 자동 스케줄링</p>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button type="button" onclick="scrollToScan()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2 text-sm whitespace-nowrap">
                    <i class="fa-solid fa-camera"></i> 문제 스캔하기
                </button>
                <button type="button" onclick="openModal('howToUseModal')" class="w-full md:w-auto bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold px-5 py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm whitespace-nowrap">
                    <i class="fa-solid fa-chart-pie"></i> 취약점 리포트
                </button>
            </div>
        </section>
